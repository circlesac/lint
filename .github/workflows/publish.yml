name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

      - name: Determine version to publish
        id: version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "Package version: $PACKAGE_VERSION"

          # Check if package.json version exists in npm
          if npm view @circlesac/lint@$PACKAGE_VERSION version > /dev/null 2>&1; then
            # Version exists, bump npm version (patch)
            NPM_VERSION=$(npm view @circlesac/lint version)
            echo "Package version $PACKAGE_VERSION already exists in npm"
            echo "Current npm version: $NPM_VERSION"
            
            # Use semver to increment patch version
            NEW_VERSION=$(node -e "const semver = require('semver'); console.log(semver.inc('$NPM_VERSION', 'patch'))")
            echo "Bumping to: $NEW_VERSION"
            VERSION=$NEW_VERSION
          else
            # Version doesn't exist, use package.json version
            echo "Package version $PACKAGE_VERSION not found in npm, using it"
            VERSION=$PACKAGE_VERSION
          fi

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Will publish version: $VERSION"

      - name: Update package.json version if needed
        id: update_version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          VERSION="${{ steps.version.outputs.VERSION }}"

          if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
            npm version $VERSION --no-git-tag-version
            echo "Updated package.json from $PACKAGE_VERSION to $VERSION"
            echo "UPDATED=true" >> $GITHUB_OUTPUT
          else
            echo "Package.json version matches, no update needed"
            echo "UPDATED=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        run: npm publish

      - name: Commit version bump and tag after successful publish
        if: steps.publish.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION="${{ steps.version.outputs.VERSION }}"
          TAG="v$VERSION"

          # Commit package.json if it was updated
          if [ "${{ steps.update_version.outputs.UPDATED }}" == "true" ]; then
            git add package.json
            git commit -m "chore: bump version to $VERSION [skip ci]"
            echo "Committed version bump"
          else
            echo "No changes to package.json"
          fi

          # Create and push tag if it doesn't exist
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists on remote, skipping"
          else
            git tag "$TAG"
            echo "Created tag $TAG"
          fi

          # Push commits and tags
          git push origin main
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "Tag already pushed"
          else
            git push origin "$TAG"
            echo "Pushed tag $TAG"
          fi
